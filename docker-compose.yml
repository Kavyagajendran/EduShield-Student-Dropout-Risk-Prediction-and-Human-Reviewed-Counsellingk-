version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: edushield-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - edushield-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml_service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    container_name: edushield-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - edushield-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: edushield-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/edushield
      - JWT_SECRET=edushield_research_jwt_secret_key_2026
      - ML_SERVICE_URL=http://ml_service:8000
    depends_on:
      mongo:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    networks:
      - edushield-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: edushield-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - edushield-network

networks:
  edushield-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local

